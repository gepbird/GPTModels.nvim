name: Tests

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Neovim
      run: sudo snap install nvim --classic

    - name: Install Neovim plugin dependencies
      run: |
        mkdir -p $HOME/.local/share/nvim/lazy/
        pushd $HOME/.local/share/nvim/lazy/
        git clone https://github.com/nvim-lua/plenary.nvim.git
        git clone https://github.com/MunifTanjim/nui.nvim
        git clone https://github.com/nvim-telescope/telescope.nvim
        popd

    - name: Run Tests
      run: make test

    - name: Check for errant util calls
      run: make no-utils

    - name: Run luacheck type check / linter
      run: |
        sudo apt-get install lua-check -y --no-install-recommends
        make check

    - uses: JohnnyMorganz/stylua-action@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        version: latest
        args: false
    - run: |
        make check-fmt

